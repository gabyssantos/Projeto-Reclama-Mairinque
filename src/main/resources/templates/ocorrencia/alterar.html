
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Ocorrência</title>


    <style>
        body {
            font-family: Arial;
            background: #f1f3f5;
            margin: 0;
        }

        /* MENU */
        .menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 10px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .menu img {
            height: 40px;
        }

        .menu-center {
            flex: 1;
            text-align: center;
        }

        .menu-left, .menu-right {
            width: 120px;
        }

        /* FORM CARD */
        .form-container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-family: Arial;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        label {
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #1F4EA3;
        }

        /* BOTÕES PRINCIPAIS */
        .acoes {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 13px 18px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #1F4EA3;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-salvar {
            background: #1F4EA3;
            color: white;
        }

        .btn-voltar {
            background: white;
            color: #1F4EA3;
        }

        .btn-salvar:hover {
            background: #173B7A;
            border-color: #173B7A;
        }

        .btn-voltar:hover {
            background: #F2C230;
            border-color: #F2C230;
            color: #222;
        }

        /* BOTÃO CÂMERA */
        .btn-camera {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1F4EA3;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-camera:hover {
            background: #173B7A;
        }

        /* FOTO ATUAL */
        .foto-atual {
            max-width: 100%;
            max-height: 220px;
            display: block;
            margin: 10px auto 20px;
            border-radius: 8px;
        }

        /* MODAL */
        .modal-foto {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
        }

        .modal-content-foto {
            background: white;
            padding: 25px;
            width: 320px;
            max-width: 85%;
            border-radius: 12px;
            text-align: center;
        }

        .botoes-foto {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .botoes-foto button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #1F4EA3;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .botoes-foto button:hover {
            background: #173B7A;
        }

        .fechar {
            background: #dc3545;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .fechar:hover {
            background: #b02a37;
        }

        /* RESPONSIVO */
        @media(max-width: 600px) {
            .form-container {
                margin: 15px;
                padding: 20px;
            }

            .acoes {
                flex-direction: column;
            }

            .menu {
                flex-direction: column;
                gap: 10px;
            }

            .menu-left, .menu-right {
                width: auto;
            }
        }
    </style>

</head>

<body>

<!-- MENU -->
<div class="menu">

    <div class="menu-left">
        <a th:href="@{/}">
            <img src="/img/home.png" alt="Início">
        </a>
    </div>

    <div class="menu-center">
        <img src="/img/logomk.png" alt="Reclama Mairinque">
    </div>

    <div class="menu-right">
        <img src="/img/whatsapp.png" alt="WhatsApp">
    </div>

</div>

<!-- FORMULÁRIO -->
<div class="form-container">

    <form id="form-cadastro"
          th:action="@{/ocorrencia/salvar}"
          th:object="${ocorrencia}"
          method="post"
          enctype="multipart/form-data">

        <input type="hidden" th:field="*{id}">

        <h2>Alterar Reclamação</h2>

        <label for="rua">Rua</label>
        <input type="text"
               id="rua"
               th:field="*{rua}"
               placeholder="Digite o nome da rua"
               required>

        <label for="bairro">Bairro</label>
        <input type="text"
               id="bairro"
               th:field="*{bairro}"
               placeholder="Digite o bairro"
               required>

        <label for="cep">CEP</label>
        <input type="text"
               id="cep"
               th:field="*{cep}"
               placeholder="Digite o CEP">

        <label for="descricao">Descrição</label>
        <textarea id="descricao"
                  th:field="*{descricaoOcorrencia}"
                  placeholder="Descreva sua reclamação"
                  maxlength="1000"
                  required></textarea>

        <label for="categoriaOcorrencia">Selecione sua ocorrência:</label>

        <select id="categoriaOcorrencia"
                th:field="*{categoriaOcorrencia}"
                required>

            <option value="">Selecione uma categoria</option>
            <option value="Limpeza da cidade">Limpeza da cidade</option>
            <option value="Posto de saude">Posto de saúde</option>
            <option value="Ruas asfaltadas">Ruas asfaltadas</option>
            <option value="Iluminacao publica">Iluminação pública</option>
            <option value="Coleta de lixo">Coleta de lixo</option>
            <option value="Areas de lazer">Áreas de lazer</option>
            <option value="Horario de onibus">Horário de ônibus</option>
            <option value="Servicos digitais">Serviços digitais</option>

        </select>

        <!-- FOTO ATUAL -->
        <label>Foto atual</label>

        <div th:if="${ocorrencia.fotoOcorrencia != null and !ocorrencia.fotoOcorrencia.isEmpty()}">
            <img class="foto-atual"
                 th:src="@{'/foto_ocorrencia/' + ${ocorrencia.fotoOcorrencia}}"
                 alt="Foto atual da ocorrência">
        </div>

        <p>Se quiser, você pode selecionar uma nova foto.</p>

        <button type="button"
                class="btn-camera"
                onclick="abrirModalFoto()">
            📷 Tirar / Selecionar Foto
        </button>

        <input type="file"
               id="inputArquivo"
               name="arquivoFoto"
               accept="image/*"
               hidden>

        <!-- BOTÕES -->
        <div class="acoes">

            <button type="submit" class="btn btn-salvar">
                Salvar alterações
            </button>

            <a th:href="@{/ocorrencia/listagem}"
               class="btn btn-voltar">
                Voltar para Lista
            </a>

        </div>

    </form>
</div>

<!-- MODAL -->
<div id="modalFoto" class="modal-foto">

    <div class="modal-content-foto">

        <h3>Selecionar Foto</h3>

        <div class="botoes-foto">
            <button type="button" onclick="selecionarArquivo()">
                📁 Arquivo
            </button>

            <button type="button" onclick="iniciarCamera()">
                📷 Câmera
            </button>
        </div>

        <video id="video" width="100%" autoplay style="display:none;"></video>
        <canvas id="canvas" style="display:none;"></canvas>

        <button type="button"
                id="btnCapturar"
                onclick="capturarFoto()"
                style="display:none;">
            📸 Capturar
        </button>

        <br><br>

        <button type="button"
                class="fechar"
                onclick="fecharModalFoto()">
            Fechar
        </button>

    </div>
</div>

<!-- FOOTER -->
<div th:replace="~{/fragments/footer.html :: footer}"></div>

<!-- JAVASCRIPT -->
<script>

    let stream;

    function abrirModalFoto() {
        document.getElementById("modalFoto").style.display = "flex";
    }

    function fecharModalFoto() {
        document.getElementById("modalFoto").style.display = "none";

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }

        document.getElementById("video").style.display = "none";
        document.getElementById("btnCapturar").style.display = "none";
    }

    function selecionarArquivo() {
        const input = document.getElementById("inputArquivo");
        input.click();
        fecharModalFoto();
    }

    function iniciarCamera() {
        const video = document.getElementById("video");
        const botao = document.getElementById("btnCapturar");

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(s) {
                stream = s;
                video.srcObject = stream;

                video.style.display = "block";
                botao.style.display = "inline-block";
            })
            .catch(function(err) {
                alert("Erro ao acessar câmera: " + err);
            });
    }

    function capturarFoto() {
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const input = document.getElementById("inputArquivo");

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0);

        canvas.toBlob(function(blob) {

            const file = new File([blob], "foto.png", {
                type: "image/png"
            });

            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);

            input.files = dataTransfer.files;

            fecharModalFoto();

        }, "image/png");
    }

</script>

</body>
</html>
