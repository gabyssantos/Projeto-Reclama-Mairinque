<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<body>
    <!-- MENU -->
    <div th:fragment="menu-content">

        <nav class="navbar navbar-expand-lg"
             style="background-color: #1F4EA3; min-height: 80px;" >

            <div class="container-fluid px-4">

                <!-- LOGO -->
                <a class="navbar-brand" th:href="@{/}">
                    <img th:src="@{/img/logo.png}"
                         alt="Reclama Mairinque"
                         title="Reclama Mairinque"
                         style="width: 200px; max-height: 75px; object-fit: contain;">
                </a>

                <!-- BOTÃO CELULAR -->
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal"
                        aria-controls="menuPrincipal"
                        aria-expanded="false"
                        aria-label="Abrir menu">

                    <span class="navbar-toggler-icon"></span>

                </button>


                <!-- LINKS -->
                <div class="collapse navbar-collapse" id="menuPrincipal">

                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

                        <!-- QUANDO NÃO ESTIVER LOGADO -->
                        <th:block th:if="${session.pessoaLogada == null}">

                            <li class="nav-item">
                                <a class="nav-link text-white fw-semibold"
                                   th:href="@{/login}">
                                    Entrar
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link fw-semibold"
                                   th:href="@{/pessoa/cadastro}"
                                   style="background-color: #F2C230;
                          color: #000;
                          border-radius: 8px;
                          padding: 10px 20px;">
                                    Criar conta
                                </a>
                            </li>

                        </th:block>

                        <!-- QUANDO ESTIVER LOGADO -->
                        <th:block th:if="${session.pessoaLogada != null}">

                            <li class="nav-item">

                                <a th:href="@{/pessoa/dashboard}"
                                   title="Meu perfil"
                                   class="d-flex align-items-center">

                                    <img th:if="${session.pessoaLogada.foto != null
                                  and !session.pessoaLogada.foto.isEmpty()}"
                                         th:src="${session.pessoaLogada.foto}"                                             alt="Foto de perfil"
                                         class="rounded-circle"
                                         style="width: 45px;
                                height: 45px;
                                object-fit: cover;
                                border: 2px solid #F2C230;">

                                    <img th:unless="${session.pessoaLogada.foto != null
                                      and !session.pessoaLogada.foto.isEmpty()}"
                                         th:src="@{/img/perfil-padrao.png}"
                                         alt="Foto de perfil"
                                         class="rounded-circle"
                                         style="width: 45px;
                                height: 45px;
                                object-fit: cover;
                                border: 2px solid #F2C230;">

                                </a>

                            </li>

                        </th:block>

                    </ul>

                </div>


            </div>

        </nav>

    </div>


    <div class="container py-4">

        <!-- CABEÇALHO -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1 class="h3 mb-1">
                    Usuários cadastrados
                </h1>

                <p class="text-muted mb-0">
                    Lista de pessoas cadastradas no sistema.
                </p>

            </div>


            <a th:href="@{/pessoa/cadastro}"
               class="btn btn-primary">

                + Novo usuário

            </a>

        </div>


        <!-- CASO NÃO TENHA USUÁRIOS -->
        <div th:if="${pessoas == null or #lists.isEmpty(pessoas)}"
             class="alert alert-info">

            Nenhum usuário cadastrado.

        </div>


        <!-- TABELA -->
        <div th:if="${pessoas != null and !#lists.isEmpty(pessoas)}"
             class="card shadow-sm border-0">

            <div class="card-body p-0">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-light">

                        <tr>

                            <th class="px-3">
                                Foto
                            </th>

                            <th>
                                Nome
                            </th>

                            <th>
                                CPF
                            </th>

                            <th>
                                E-mail
                            </th>

                            <th>
                                Telefone
                            </th>

                            <th>
                                Cidade
                            </th>

                            <th>
                                Perfil
                            </th>

                            <th>
                                Status
                            </th>

                            <th class="text-center">
                                Ações
                            </th>

                        </tr>

                        </thead>


                        <tbody>

                        <tr th:each="pessoa : ${pessoas}">


                            <!-- FOTO -->
                            <td class="px-3">

                                <div th:if="${pessoa.foto != null}">

                                    <img th:src="@{${pessoa.foto}}"
                                         alt="Foto do usuário"
                                         width="55"
                                         height="55"
                                         class="rounded-circle"
                                         style="object-fit: cover;">

                                </div>


                                <div th:unless="${pessoa.foto != null}"
                                     class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center"
                                     style="width:55px; height:55px;">

                                    <span>
                                        ?
                                    </span>

                                </div>

                            </td>


                            <!-- NOME -->
                            <td>

                                <strong th:text="${pessoa.nome}">
                                    Nome
                                </strong>

                            </td>


                            <!-- CPF -->
                            <td>

                                <span th:text="${pessoa.cpf != null ? pessoa.cpf : '-'}">
                                    -
                                </span>

                            </td>


                            <!-- E-MAIL -->
                            <td>

                                <span th:text="${pessoa.email}">
                                    -
                                </span>

                            </td>


                            <!-- TELEFONE -->
                            <td>

                                <span th:text="${pessoa.telefone != null ? pessoa.telefone : '-'}">
                                    -
                                </span>

                            </td>


                            <!-- CIDADE -->
                            <td>

                                <span th:text="${pessoa.cidade != null ? pessoa.cidade : '-'}">
                                    -
                                </span>

                            </td>


                            <!-- PERFIL -->
                            <td>

                                <!-- ADMINISTRADOR -->
                                <span th:if="${pessoa.perfil != null and pessoa.perfil.toString() == 'ADMINISTRADOR'}"
                                      class="badge bg-danger">

                                    Administrador

                                </span>


                                <!-- MODERADOR -->
                                <span th:if="${pessoa.perfil != null and pessoa.perfil.toString() == 'MODERADOR'}"
                                      class="badge bg-warning text-dark">

                                    Moderador

                                </span>


                                <!-- NORMAL -->
                                <span th:if="${pessoa.perfil != null and pessoa.perfil.toString() == 'NORMAL'}"
                                      class="badge bg-primary">

                                    Normal

                                </span>


                                <!-- PERFIL NULL -->
                                <span th:if="${pessoa.perfil == null}"
                                      class="badge bg-secondary">

                                    Não definido

                                </span>

                            </td>


                            <!-- STATUS -->
                            <td>

                                <span th:if="${pessoa.ativo == true}"
                                      class="badge bg-success">

                                    Ativo

                                </span>


                                <span th:if="${pessoa.ativo == false}"
                                      class="badge bg-secondary">

                                    Inativo

                                </span>


                                <span th:if="${pessoa.ativo == null}"
                                      class="badge bg-secondary">

                                    Não definido

                                </span>

                            </td>


                            <!-- AÇÕES -->
                            <td class="text-center">

                                <div class="d-flex justify-content-center gap-2">


                                    <!-- EDITAR -->
                                    <a th:href="@{/pessoa/editar/{id}(id=${pessoa.id})}"
                                       class="btn btn-sm btn-outline-primary">

                                        Editar

                                    </a>


                                    <!-- EXCLUIR -->
                                    <a th:href="@{/pessoa/excluir/{id}(id=${pessoa.id})}"
                                       class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('Tem certeza que deseja excluir este usuário?');">

                                        Excluir

                                    </a>

                                </div>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- FOOTER -->
<div th:insert="~{fragments/footer :: footer-content}"></div>


</body>
</html>
