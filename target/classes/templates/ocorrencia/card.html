<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ocorrências</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f3f5;
            margin: 0;
        }

        /* MENU SUPERIOR */
        .menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 10px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .menu img {
            height: 40px;
        }

        .menu-center {
            text-align: center;
            flex: 1;
        }

        .menu-left, .menu-right {
            width: 120px;
        }

        .menu-left a img {
            cursor: pointer;
        }

        /* TOPO */
        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        h2 {
            margin: 0;
        }

        input {
            padding: 10px;
            width: 250px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        /* BOTÃO MODERNO */
        .btn-novo {
            background: #198754;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-novo:hover {
            background: #157347;
            transform: scale(1.05);
        }

        /* GRID */
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 20px;
        }

        /* CARD */
        .card {
            background: white;
            border-radius: 12px;
            border: 1px solid #ddd;
            overflow: hidden;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* HEADER */
        .card-header {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            font-size: 13px;
        }

        /* BADGE */
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            color: white;
            font-size: 11px;
        }

        .aberta { background: #0d6efd; }
        .andamento { background: #ffc107; color: black; }
        .concluida { background: #198754; }

        /* IMAGEM MAIS RETANGULAR */
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        /* BODY */
        .card-body {
            padding: 12px;
            font-size: 14px;
        }

        /* BOTÕES */
        .card-actions {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 1px solid #eee;
        }

        .card-actions a {
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: white;
        }

        .btn-edit { background: #0d6efd; }
        .btn-delete { background: #dc3545; }

        /* RESPONSIVIDADE */
        @media(max-width: 900px){
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 600px){
            .container {
                grid-template-columns: 1fr;
            }

            .topo {
                flex-direction: column;
                align-items: stretch;
            }

            input {
                width: 100%;
            }

            .btn-novo {
                text-align: center;
            }

            .menu {
                flex-direction: column;
                gap: 10px;
            }

            .menu-left, .menu-right {
                width: auto;
            }
        }

    </style>
</head>

<body>

<!-- MENU -->
<div class="menu">
    <div class="menu-left">
        <a th:href="@{/}">
            <img src="/img/home.png">
        </a>
    </div>

    <div class="menu-center">
        <img src="/img/logomk.png">
    </div>

    <div class="menu-right">
        <img src="/img/whatsapp.png">
    </div>
</div>

<!-- TOPO -->
<div class="topo">
    <h2>Ocorrências</h2>
    <input type="text" id="busca" placeholder="🔎 Buscar...">
    <a th:href="@{/ocorrencia/cadastro}" class="btn-novo">+ Cadastrar Novo</a>
</div>

<!-- CARDS -->
<div class="container" id="listaCards">

    <div class="card" th:each="p : ${ocorrencias}">

        <div class="card-header">
            <span th:text="${p.dataOcorrencia}"></span>

            <span class="badge"
                  th:classappend="${p.status == 'ABERTA'} ? 'aberta' :
                                  (${p.status == 'EM_ANDAMENTO'} ? 'andamento' : 'concluida')"
                  th:text="${p.status}">
            </span>
        </div>

        <img th:if="${p.fotoOcorrencia != null}"
             th:src="@{'/foto_ocorrencia/' + ${p.fotoOcorrencia}}">

        <img th:if="${p.fotoOcorrencia == null}"
             src="/foto_ocorrencia/default.png">

        <div class="card-body">
            <p><strong>Rua:</strong> <span th:text="${p.rua}"></span></p>
            <p><strong>Bairro:</strong> <span th:text="${p.bairro}"></span></p>
            <p th:text="${p.descricaoOcorrencia}"></p>
        </div>

        <div class="card-actions">
            <a th:href="@{/ocorrencia/alterar/{id}(id=${p.id})}" class="btn-edit">Alterar</a>
            <a th:href="@{/ocorrencia/excluir/{id}(id=${p.id})}"
               onclick="return confirm('Deseja excluir?')"
               class="btn-delete">Excluir</a>
        </div>

    </div>

</div>

</body>
</html>
