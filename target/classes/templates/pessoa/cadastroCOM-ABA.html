<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Cadastrar usuário')}">
</head>

<body>

<div class="container-fluid p-0 m-0">

    <!-- MENU -->
    <div th:insert="~{fragments/menu :: menu-content}"></div>

    <div class="row justify-content-center">

        <div class="col-12 col-lg-10 col-xl-9">

            <div class="card shadow-sm">

                <!-- CABEÇALHO -->
                <div class="card-header bg-primary text-white p-4">

                    <h1 class="h3 mb-1">
                        Cadastro de usuário
                    </h1>

                    <p class="mb-0 opacity-75">
                        Preencha os dados para cadastrar uma nova pessoa.
                    </p>

                </div>

                <div class="card-body p-4 p-md-5">

                    <!--
                    IMPORTANTE:
                    enctype é necessário para enviar arquivos.
                    -->
                    <form th:action="@{/pessoa/salvar}"
                          th:object="${pessoa}"
                          method="post"
                          enctype="multipart/form-data">

                        <!-- ================================================= -->
                        <!-- ABAS                                              -->
                        <!-- ================================================= -->

                        <ul class="nav nav-tabs cadastro-tabs mb-4"
                            id="cadastroTabs">

                            <li class="nav-item">

                                <button type="button"
                                        class="nav-link active"
                                        id="abaDados"
                                        onclick="mostrarAba('dados')">

                                    <i class="bi bi-person"></i>
                                    Dados pessoais

                                </button>

                            </li>

                            <li class="nav-item">

                                <button type="button"
                                        class="nav-link"
                                        id="abaEndereco"
                                        onclick="mostrarAba('endereco')">

                                    <i class="bi bi-geo-alt"></i>
                                    Endereço

                                </button>

                            </li>

                        </ul>


                        <!-- ================================================= -->
                        <!-- ABA 1 - DADOS PESSOAIS                            -->
                        <!-- ================================================= -->

                        <div id="abaDadosConteudo"
                             class="aba-conteudo">

                            <h2 class="section-title">
                                Dados pessoais
                            </h2>

                            <div class="row g-3">

                                <!-- NOME -->
                                <div class="col-12">

                                    <label for="nome"
                                           class="form-label required">
                                        Nome completo
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="nome"
                                           th:field="*{nome}"
                                           placeholder="Digite o nome completo"
                                           required>

                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('nome')}"
                                         th:errors="*{nome}">
                                    </div>

                                </div>


                                <!-- CPF -->
                                <div class="col-md-6">

                                    <label for="cpf"
                                           class="form-label">
                                        CPF
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="cpf"
                                           th:field="*{cpf}"
                                           placeholder="000.000.000-00">

                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('cpf')}"
                                         th:errors="*{cpf}">
                                    </div>

                                </div>


                                <!-- E-MAIL -->
                                <div class="col-md-6">

                                    <label for="email"
                                           class="form-label required">
                                        E-mail
                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           id="email"
                                           th:field="*{email}"
                                           placeholder="exemplo@email.com"
                                           required>

                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('email')}"
                                         th:errors="*{email}">
                                    </div>

                                </div>


                                <!-- TELEFONE -->
                                <div class="col-md-6">

                                    <label for="telefone"
                                           class="form-label">
                                        Telefone
                                    </label>

                                    <input type="tel"
                                           class="form-control"
                                           id="telefone"
                                           th:field="*{telefone}"
                                           placeholder="(00) 00000-0000">

                                </div>


                            </div>


                            <!-- ================================================= -->
                            <!-- ACESSO                                           -->
                            <!-- ================================================= -->

                            <h2 class="section-title mt-5">
                                Acesso
                            </h2>

                            <div class="row g-3">

                                <!-- SENHA -->
                                <div class="col-md-6">

                                    <label for="senha"
                                           class="form-label required">
                                        Senha
                                    </label>

                                    <input type="password"
                                           class="form-control"
                                           id="senha"
                                           th:field="*{senha}"
                                           placeholder="Digite uma senha"
                                           required>

                                </div>


                                <!-- CONFIRMAR SENHA -->
                                <div class="col-md-6">

                                    <label for="confirmarSenha"
                                           class="form-label required">
                                        Confirmar senha
                                    </label>

                                    <input type="password"
                                           class="form-control"
                                           id="confirmarSenha"
                                           name="confirmarSenha"
                                           placeholder="Digite a senha novamente"
                                           required>

                                    <div class="text-danger small mt-1"
                                         th:if="${senhaErro}"
                                         th:text="${senhaErro}">
                                    </div>

                                </div>

                            </div>


                            <!-- BOTÃO PRÓXIMO -->

                            <div class="d-flex justify-content-end mt-4">

                                <button type="button"
                                        class="btn btn-primary"
                                        onclick="abrirEndereco()">

                                    Próximo
                                    <i class="bi bi-arrow-right"></i>

                                </button>

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- ABA 2 - ENDEREÇO                                  -->
                        <!-- ================================================= -->

                        <div id="abaEnderecoConteudo"
                             class="aba-conteudo"
                             style="display: none;">

                            <h2 class="section-title">
                                Endereço
                            </h2>


                            <div class="row g-3">

                                <!-- CEP -->
                                <div class="col-md-4">

                                    <label for="cep"
                                           class="form-label">
                                        CEP
                                    </label>

                                    <div class="input-group">

                                        <input type="text"
                                               class="form-control"
                                               id="cep"
                                               th:field="*{cep}"
                                               placeholder="00000-000"
                                               maxlength="9">

                                        <button type="button"
                                                class="btn btn-primary"
                                                id="btnBuscarCep"
                                                onclick="buscarCEP()">

                                            Buscar

                                        </button>

                                    </div>

                                    <div id="mensagemCep"
                                         class="small mt-2">
                                    </div>

                                </div>


                                <!-- LOGRADOURO -->
                                <div class="col-md-8">

                                    <label for="logradouro"
                                           class="form-label">
                                        Logradouro
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="logradouro"
                                           th:field="*{logradouro}"
                                           placeholder="Rua, Avenida, etc.">

                                </div>


                                <!-- NÚMERO -->
                                <div class="col-md-4">

                                    <label for="numero"
                                           class="form-label">
                                        Número
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="numero"
                                           th:field="*{numero}"
                                           placeholder="Número">

                                </div>


                                <!-- COMPLEMENTO -->
                                <div class="col-md-8">

                                    <label for="complemento"
                                           class="form-label">
                                        Complemento
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="complemento"
                                           th:field="*{complemento}"
                                           placeholder="Apartamento, bloco, etc.">

                                </div>


                                <!-- BAIRRO -->
                                <div class="col-md-6">

                                    <label for="bairro"
                                           class="form-label">
                                        Bairro
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="bairro"
                                           th:field="*{bairro}"
                                           placeholder="Bairro">

                                </div>


                                <!-- CIDADE -->
                                <div class="col-md-6">

                                    <label for="cidade"
                                           class="form-label">
                                        Cidade
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="cidade"
                                           th:field="*{cidade}"
                                           placeholder="Cidade">

                                </div>


                                <!-- ESTADO -->
                                <div class="col-md-6">

                                    <label for="estado"
                                           class="form-label">
                                        Estado
                                    </label>

                                    <select class="form-select"
                                            id="estado"
                                            th:field="*{estado}">

                                        <option value="">
                                            Selecione o estado
                                        </option>

                                        <option value="AC">Acre</option>
                                        <option value="AL">Alagoas</option>
                                        <option value="AP">Amapá</option>
                                        <option value="AM">Amazonas</option>
                                        <option value="BA">Bahia</option>
                                        <option value="CE">Ceará</option>
                                        <option value="DF">Distrito Federal</option>
                                        <option value="ES">Espírito Santo</option>
                                        <option value="GO">Goiás</option>
                                        <option value="MA">Maranhão</option>
                                        <option value="MT">Mato Grosso</option>
                                        <option value="MS">Mato Grosso do Sul</option>
                                        <option value="MG">Minas Gerais</option>
                                        <option value="PA">Pará</option>
                                        <option value="PB">Paraíba</option>
                                        <option value="PR">Paraná</option>
                                        <option value="PE">Pernambuco</option>
                                        <option value="PI">Piauí</option>
                                        <option value="RJ">Rio de Janeiro</option>
                                        <option value="RN">Rio Grande do Norte</option>
                                        <option value="RS">Rio Grande do Sul</option>
                                        <option value="RO">Rondônia</option>
                                        <option value="RR">Roraima</option>
                                        <option value="SC">Santa Catarina</option>
                                        <option value="SP">São Paulo</option>
                                        <option value="SE">Sergipe</option>
                                        <option value="TO">Tocantins</option>

                                    </select>

                                </div>

                            </div>


                            <!-- ================================================= -->
                            <!-- LOCALIZAÇÃO                                      -->
                            <!-- ================================================= -->

                            <h2 class="section-title mt-5">
                                Localização
                            </h2>

                            <div class="row g-3">

                                <!-- LATITUDE -->
                                <div class="col-md-6">

                                    <label for="latitude"
                                           class="form-label">
                                        Latitude
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           id="latitude"
                                           th:field="*{latitude}"
                                           step="any"
                                           placeholder="-22.000000">

                                </div>


                                <!-- LONGITUDE -->
                                <div class="col-md-6">

                                    <label for="longitude"
                                           class="form-label">
                                        Longitude
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           id="longitude"
                                           th:field="*{longitude}"
                                           step="any"
                                           placeholder="-47.000000">

                                </div>

                            </div>


                            <div id="mensagemLocalizacao"
                                 class="small mt-2">
                            </div>


                            <!-- MAPA -->

                            <div class="mt-4">

                                <label class="form-label">
                                    Localização no mapa
                                </label>

                                <div id="mapa"
                                     class="mapa-container">

                                    <div class="d-flex justify-content-center align-items-center h-100 text-muted">

                                        Informe um CEP para localizar o endereço no mapa.

                                    </div>

                                </div>

                            </div>


                            <!-- ================================================= -->
                            <!-- BOTÕES                                            -->
                            <!-- ================================================= -->

                            <div class="d-flex justify-content-between mt-4">

                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        onclick="abrirDados()">

                                    <i class="bi bi-arrow-left"></i>
                                    Voltar

                                </button>


                                <div class="d-flex gap-2">

                                    <a th:href="@{/pessoa/listagem}"
                                       class="btn btn-outline-secondary">

                                        Cancelar

                                    </a>

                                    <button type="submit"
                                            class="btn btn-primary">

                                        <i class="bi bi-check-lg"></i>
                                        Cadastrar usuário

                                    </button>

                                </div>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ========================================================= -->
<!-- FOOTER                                                    -->
<!-- ========================================================= -->

<div th:insert="~{fragments/footer :: footer-content}"></div>


<!-- ========================================================= -->
<!-- CSS                                                       -->
<!-- ========================================================= -->

<style>

    body {
        background-color: #f8f9fa;
    }

    .card {
        border: none;
        border-radius: 12px;
    }

    .card-header {
        border-radius: 12px 12px 0 0 !important;
    }

    .section-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: #343a40;
        border-bottom: 1px solid #dee2e6;
        padding-bottom: 8px;
        margin-bottom: 20px;
    }

    .required::after {
        content: " *";
        color: #dc3545;
    }

    .mapa-container {
        width: 100%;
        height: 350px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #dee2e6;
        background-color: #f8f9fa;
    }

    .mapa-container iframe {
        width: 100%;
        height: 100%;
        border: 0;
    }

    #btnBuscarCep {
        min-width: 90px;
    }

    /* =========================================================
       ABAS
       ========================================================= */

    .cadastro-tabs {
        border-bottom: 2px solid #dee2e6;
    }

    .cadastro-tabs .nav-link {
        color: #6c757d;
        font-weight: 500;
        border: none;
        padding: 12px 20px;
    }

    .cadastro-tabs .nav-link:hover {
        color: #0d6efd;
    }

    .cadastro-tabs .nav-link.active {
        color: #0d6efd;
        background-color: transparent;
        border-bottom: 3px solid #0d6efd;
    }

    .aba-conteudo {
        animation: aparecerAba 0.2s ease-in-out;
    }

    @keyframes aparecerAba {

        from {
            opacity: 0;
            transform: translateY(5px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }

    }

</style>


<!-- ========================================================= -->
<!-- JAVASCRIPT                                                -->
<!-- ========================================================= -->

<script>

    /*
     * =========================================================
     * BUSCAR CEP
     * =========================================================
     */

    async function buscarCEP() {

        const campoCep =
            document.getElementById("cep");

        const mensagemCep =
            document.getElementById("mensagemCep");

        const mensagemLocalizacao =
            document.getElementById("mensagemLocalizacao");

        const botao =
            document.getElementById("btnBuscarCep");

        const cep =
            campoCep.value.replace(/\D/g, "");

        if (cep.length !== 8) {

            mensagemCep.innerHTML =
                '<span class="text-danger">' +
                'Digite um CEP válido com 8 números.' +
                '</span>';

            return;
        }

        botao.disabled = true;

        mensagemCep.innerHTML =
            '<span class="text-primary">' +
            'Consultando CEP...' +
            '</span>';

        mensagemLocalizacao.innerHTML = "";

        try {

            const resposta =
                await fetch(
                    `https://viacep.com.br/ws/${cep}/json/`
                );

            if (!resposta.ok) {

                throw new Error(
                    "Erro na API ViaCEP."
                );

            }

            const dados =
                await resposta.json();

            if (dados.erro) {

                mensagemCep.innerHTML =
                    '<span class="text-danger">' +
                    'CEP não encontrado.' +
                    '</span>';

                return;
            }

            /*
             * PREENCHER ENDEREÇO
             */

            document.getElementById("logradouro").value =
                dados.logradouro || "";

            document.getElementById("bairro").value =
                dados.bairro || "";

            document.getElementById("cidade").value =
                dados.localidade || "";

            document.getElementById("estado").value =
                dados.uf || "";

            mensagemCep.innerHTML =
                '<span class="text-success">' +
                'Endereço encontrado com sucesso!' +
                '</span>';

            /*
             * BUSCAR COORDENADAS
             */

            await buscarCoordenadas(dados);

        } catch (erro) {

            console.error(
                "Erro:",
                erro
            );

            mensagemCep.innerHTML =
                '<span class="text-danger">' +
                'Erro ao consultar o CEP.' +
                '</span>';

        } finally {

            botao.disabled = false;

        }

    }


    /*
     * =========================================================
     * BUSCAR LATITUDE E LONGITUDE
     * =========================================================
     */

    async function buscarCoordenadas(dados) {

        const mensagem =
            document.getElementById(
                "mensagemLocalizacao"
            );

        const campoLatitude =
            document.getElementById(
                "latitude"
            );

        const campoLongitude =
            document.getElementById(
                "longitude"
            );

        mensagem.innerHTML =
            '<span class="text-primary">' +
            'Localizando o endereço no mapa...' +
            '</span>';

        const enderecoCompleto = [

            dados.logradouro,
            dados.bairro,
            dados.localidade,
            dados.uf,
            "Brasil"

        ]
        .filter(Boolean)
        .join(", ");

        let resultados =
            await pesquisarNominatim(
                enderecoCompleto
            );

        /*
         * SEGUNDA TENTATIVA
         */

        if (
            !resultados ||
            resultados.length === 0
        ) {

            const enderecoAlternativo = [

                dados.bairro,
                dados.localidade,
                dados.uf,
                "Brasil"

            ]
            .filter(Boolean)
            .join(", ");

            resultados =
                await pesquisarNominatim(
                    enderecoAlternativo
                );

        }

        /*
         * NENHUM RESULTADO
         */

        if (
            !resultados ||
            resultados.length === 0
        ) {

            mensagem.innerHTML =
                '<span class="text-warning">' +
                'O endereço foi encontrado, mas não foi possível obter as coordenadas automaticamente. Você poderá preencher latitude e longitude manualmente.' +
                '</span>';

            return;

        }

        const resultado =
            resultados[0];

        const latitude =
            parseFloat(
                resultado.lat
            );

        const longitude =
            parseFloat(
                resultado.lon
            );

        if (
            isNaN(latitude) ||
            isNaN(longitude)
        ) {

            mensagem.innerHTML =
                '<span class="text-warning">' +
                'As coordenadas retornadas são inválidas.' +
                '</span>';

            return;

        }

        campoLatitude.value =
            latitude;

        campoLongitude.value =
            longitude;

        mensagem.innerHTML =
            '<span class="text-success">' +
            'Latitude e longitude encontradas com sucesso!' +
            '</span>';

        mostrarMapa(
            latitude,
            longitude
        );

    }


    /*
     * =========================================================
     * CONSULTAR NOMINATIM
     * =========================================================
     */

    async function pesquisarNominatim(endereco) {

        try {

            const url =
                "https://nominatim.openstreetmap.org/search" +
                "?format=json" +
                "&limit=1" +
                "&countrycodes=br" +
                "&addressdetails=1" +
                "&q=" +
                encodeURIComponent(endereco);

            const resposta =
                await fetch(url);

            if (!resposta.ok) {

                throw new Error(
                    "Erro no Nominatim."
                );

            }

            return await resposta.json();

        } catch (erro) {

            console.error(
                "Erro Nominatim:",
                erro
            );

            return [];

        }

    }


    /*
     * =========================================================
     * MOSTRAR MAPA
     * =========================================================
     */

    function mostrarMapa(
        latitude,
        longitude
    ) {

        const mapa =
            document.getElementById(
                "mapa"
            );

        const tamanho =
            0.01;

        const bbox =

            (longitude - tamanho) +
            "%2C" +

            (latitude - tamanho) +
            "%2C" +

            (longitude + tamanho) +
            "%2C" +

            (latitude + tamanho);

        mapa.innerHTML =

            '<iframe ' +

            'src="' +

            'https://www.openstreetmap.org/export/embed.html?' +

            'bbox=' +

            bbox +

            '&layer=mapnik' +

            '&marker=' +

            latitude +

            '%2C' +

            longitude +

            '"' +

            'loading="lazy">' +

            '</iframe>';

    }


    /*
     * =========================================================
     * ATUALIZAR MAPA MANUALMENTE
     * =========================================================
     */

    document
        .getElementById("latitude")
        .addEventListener(
            "change",
            atualizarMapaManual
        );

    document
        .getElementById("longitude")
        .addEventListener(
            "change",
            atualizarMapaManual
        );


    function atualizarMapaManual() {

        const latitude =
            parseFloat(
                document.getElementById(
                    "latitude"
                ).value
            );

        const longitude =
            parseFloat(
                document.getElementById(
                    "longitude"
                ).value
            );

        if (
            !isNaN(latitude) &&
            !isNaN(longitude)
        ) {

            mostrarMapa(
                latitude,
                longitude
            );

        }

    }


    /*
     * =========================================================
     * MÁSCARA DO CEP
     * =========================================================
     */

    document
        .getElementById("cep")
        .addEventListener(
            "input",
            function () {

                let valor =
                    this.value.replace(
                        /\D/g,
                        ""
                    );

                valor =
                    valor.substring(
                        0,
                        8
                    );

                if (
                    valor.length > 5
                ) {

                    valor =
                        valor.substring(
                            0,
                            5
                        ) +
                        "-" +
                        valor.substring(
                            5
                        );

                }

                this.value =
                    valor;

            }
        );


    /*
     * =========================================================
     * ENTER NO CEP
     * =========================================================
     */

    document
        .getElementById("cep")
        .addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    buscarCEP();

                }

            }
        );


    /*
     * =========================================================
     * ABAS
     * =========================================================
     */

    function abrirEndereco() {

        document
            .getElementById("abaDadosConteudo")
            .style.display = "none";

        document
            .getElementById("abaEnderecoConteudo")
            .style.display = "block";

        document
            .getElementById("abaDados")
            .classList.remove("active");

        document
            .getElementById("abaEndereco")
            .classList.add("active");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    function abrirDados() {

        document
            .getElementById("abaDadosConteudo")
            .style.display = "block";

        document
            .getElementById("abaEnderecoConteudo")
            .style.display = "none";

        document
            .getElementById("abaDados")
            .classList.add("active");

        document
            .getElementById("abaEndereco")
            .classList.remove("active");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /*
     * =========================================================
     * CLIQUE NAS ABAS
     * =========================================================
     */

    function mostrarAba(aba) {

        if (aba === "dados") {

            abrirDados();

        }

        if (aba === "endereco") {

            abrirEndereco();

        }

    }

</script>

</body>
</html>
