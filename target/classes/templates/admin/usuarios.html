<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Usuários - Reclama Mairinque</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1F4EA3;">
    <div class="container">
      <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">
        Reclama Mairinque
      </a>

      <a th:href="@{/admin/dashboard}" class="btn btn-light">
        Voltar ao painel
      </a>
    </div>
  </nav>
</header>

<main class="container py-5">

  <div class="mb-4">
    <h2>Gerenciar usuários</h2>
    <p class="text-muted">
      Consulte os usuários cadastrados na plataforma.
    </p>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">

      <div class="table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-primary">
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>CPF</th>
            <th>Telefone</th>
            <th>Perfil</th>
            <th>Situação</th>
          </tr>
          </thead>

          <tbody>

          <tr th:each="usuario : ${usuarios}">

            <td th:text="${usuario.id}"></td>

            <td th:text="${usuario.nome}"></td>

            <td th:text="${usuario.email}"></td>

            <td th:text="${usuario.cpf}"></td>

            <td th:text="${usuario.telefone}"></td>

            <td th:text="${usuario.perfil}"></td>

            <td>
                            <span th:if="${usuario.ativo}"
                                  class="badge bg-success">
                                Ativo
                            </span>

              <span th:unless="${usuario.ativo}"
                    class="badge bg-danger">
                                Inativo
                            </span>
            </td>

          </tr>

          <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="7" class="text-center text-muted">
              Nenhum usuário cadastrado.
            </td>
          </tr>

          </tbody>

        </table>

      </div>

      <p class="text-muted mt-3">
        Total de usuários:
        <strong th:text="${#lists.size(usuarios)}">0</strong>
      </p>

    </div>
  </div>

</main>

<footer class="text-center text-white py-3"
        style="background-color: #1F4EA3;">
  © 2027 Reclama Mairinque - Licença MIT.
</footer>

</body>
</html>
